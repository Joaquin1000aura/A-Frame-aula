          <script>
      const interruptor = document.querySelector('#interruptor')
      const luz1 = document.querySelector('#luzdefra')
      const luz2 = document.querySelector('#luzpro')
      const luz3 = document.querySelector('#luzretro')
      
     
      let encendido = true

      
      interruptor.addEventListener('click', function () {
        if (encendido) {
         
      luz1.setAttribute('color', 'black')
      luz2.setAttribute('color', 'black')
      luz3.setAttribute('color', 'black')
          encendido = false
        } else {
    
      luz1.setAttribute('color', 'white')
      luz2.setAttribute('color', 'white')
      luz3.setAttribute('color', 'white')
          encendido = true
        }
      })
    </script>
    <script>
      const tiza = document.querySelector('#tiza')
      let grande = false

      tiza.addEventListener('click', function () {
        if (!grande) {
          tiza.setAttribute('scale', '2 2 2')
          grande = true
        } else {
          tiza.setAttribute('scale', '1 1 1')
          grande = false
        }
      })
    </script>
    <script>
      const pizarra = document.querySelector('#pizarra')
      let verde = true

      pizarra.addEventListener('click', function () {
        if (verde) {
          pizarra.setAttribute('color', 'black')
          verde = false
        } else {
          pizarra.setAttribute('color', 'green')
          verde = true
        }
      })
    </script>
    <script>
      const profesor = document.querySelector('#profesor')
      let movido = false

      profesor.addEventListener('click', function () {
        if (!movido) {
          profesor.setAttribute('rotation', '0 180 0')
          movido = true
        } else {
          profesor.setAttribute('rotation', '0 0 0')
          movido = false
        }
      })
    </script>
    <script>
      const computadora = document.querySelector('#computadora')
      let cerrada = false

      computadora.addEventListener('click', function () {
        cerrada = !cerrada
        computadora.setAttribute('animation', {
          property: 'rotation',       
          to: cerrada ? '0 0 0' : '-90 0 0',  
          dur: 600,                      
          easing: 'easeInOutQuad'
        })       
      })
    </script>
    <script>
      const puerta = document.querySelector('#puerta')
      const puertaboton = document.querySelector('#puertaboton')
      let puertaVisible = true

      puerta.addEventListener('click', function () {
        puertaVisible = false
        puerta.setAttribute('visible', puertaVisible)
        puerta.setAttribute('animation', {
          property: 'material.opacity',
          to: 0,
          dur: 1000,
          easing: 'easeInOutQuad'
        })
      })

      puertaboton.addEventListener('click', function () {
        puertaVisible = true
        puerta.setAttribute('visible', puertaVisible)
        puerta.setAttribute('animation', {
          property: 'material.opacity',
          to: 1,
          dur: 1000,
          easing: 'easeInOutQuad'
        })
      })
    </script>
